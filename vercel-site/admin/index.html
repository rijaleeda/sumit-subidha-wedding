<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>RSVP Dashboard | Sumit &amp; Subidha</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3eee4;color:#2b2925;font-family:Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:32px 18px 60px}.login{max-width:440px;margin:10vh auto;background:#fffdf8;border:1px solid #cdbb91;padding:32px;text-align:center}.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.24em;color:#927033}h1,h2{font-family:Georgia,serif;font-weight:400;color:#781d18}h1{font-size:40px;margin:8px 0}h2{font-size:26px}.login input{display:block;width:100%;padding:13px;border:1px solid #cdbb91;margin:14px 0}.button{border:0;background:#7d1e18;color:#fffaf1;padding:11px 16px;cursor:pointer}.button.full{width:100%}.error{color:#9b1c1c}.header{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid #cdbb91;padding-bottom:24px;margin-bottom:30px}.logout{border:1px solid #b9a477;background:transparent;padding:9px 14px;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:30px}.stat{border:1px solid #d5c6a7;background:#fffdf8;padding:16px}.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#70685d}.stat strong{display:block;font-family:Georgia,serif;font-size:30px;font-weight:400;color:#781d18;margin-top:8px}.panel{border:1px solid #cdbb91;background:#fffdf8;overflow:hidden}.panel h2{padding:0 20px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;border-top:1px solid #e2d8c5;padding:13px 12px;vertical-align:top}th{background:#f5f0e6;color:#70685d;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.accept{color:#47704b}.decline{color:#8b3c38}.empty{text-align:center;padding:50px;color:#70685d}.actions{display:flex;gap:6px;white-space:nowrap}.actions button{border:1px solid #b9a477;background:#fffaf1;padding:7px 10px;cursor:pointer}.actions .delete{border-color:#c9938f;color:#8d2a24}.edit-input,.edit-select,.edit-note{width:100%;min-width:75px;border:1px solid #cdbb91;background:white;padding:7px;font:inherit}.edit-name{min-width:145px}.edit-note{min-width:180px;resize:vertical}.notice{margin:0 20px 16px;color:#47704b}.notice.error{color:#9b1c1c}@media(max-width:800px){.summary{grid-template-columns:repeat(3,1fr)}.header{align-items:start;gap:15px}.wrap{padding-top:20px}}@media(max-width:480px){.summary{grid-template-columns:repeat(2,1fr)}h1{font-size:32px}}
  </style>
</head>
<body>
  <section class="login" id="login"><p class="eyebrow">Sumit &amp; Subidha</p><h1>Organizer Login</h1><p>Enter your organizer email and private wedding password.</p><form id="login-form"><input id="email" type="email" required autocomplete="email" placeholder="Organizer email"><input id="password" type="password" required autocomplete="current-password" placeholder="Password"><button class="button full">Open dashboard</button><p class="error" id="login-error" hidden>Email or password not recognized.</p></form></section>
  <main class="wrap" id="dashboard" hidden><header class="header"><div><p class="eyebrow">Sumit &amp; Subidha</p><h1>RSVP Dashboard</h1></div><button class="logout" id="logout">Log out</button></header><section class="summary" id="summary"></section><section class="panel"><h2>Guest responses</h2><p class="notice" id="notice" hidden></p><div class="scroll" id="responses"></div></section></main>
  <script>
    const API='https://sumit-subidha-wedding.eedarijal.chatgpt.site/api/admin/rsvps';
    const login=document.querySelector('#login'),dashboard=document.querySelector('#dashboard'),err=document.querySelector('#login-error'),notice=document.querySelector('#notice'),responsesView=document.querySelector('#responses');
    let credentials=null,rows=[],editingId=null;
    const headers=()=>({authorization:'Bearer '+credentials.password,'x-admin-email':credentials.email,'content-type':'application/json'});
    async function load(email,password){const res=await fetch(API,{headers:{authorization:'Bearer '+password,'x-admin-email':email.trim().toLowerCase()}});if(!res.ok)throw new Error();const data=await res.json();credentials={email:email.trim().toLowerCase(),password};sessionStorage.setItem('wedding-admin',JSON.stringify(credentials));rows=data.responses;editingId=null;render();login.hidden=true;dashboard.hidden=false}
    function render(){const accepted=rows.filter(r=>r.attendance==='accept'),sum=k=>accepted.reduce((a,r)=>a+Number(r[k]||0),0),declined=rows.length-accepted.length;document.querySelector('#summary').innerHTML=[['Responses',rows.length],['Attending',accepted.length],['Adults',sum('adults')],['Children',sum('children')],['Infants',sum('infants')],['Declined',declined]].map(([l,v])=>`<div class="stat"><span>${l}</span><strong>${v}</strong></div>`).join('');responsesView.innerHTML=rows.length?`<table><thead><tr><th>Name</th><th>Status</th><th>Adults</th><th>Children</th><th>Infants</th><th>Note</th><th>Date</th><th>Actions</th></tr></thead><tbody>${rows.map(rowHtml).join('')}</tbody></table>`:'<div class="empty">No RSVPs yet.</div>'}
    function rowHtml(r){if(editingId===r.id)return `<tr data-id="${r.id}"><td><input class="edit-input edit-name" data-field="name" value="${esc(r.name)}"></td><td><select class="edit-select" data-field="attendance"><option value="accept" ${r.attendance==='accept'?'selected':''}>Attending</option><option value="decline" ${r.attendance==='decline'?'selected':''}>Declined</option></select></td><td><input class="edit-input" data-field="adults" type="number" min="0" max="10" value="${r.adults}"></td><td><input class="edit-input" data-field="children" type="number" min="0" max="10" value="${r.children}"></td><td><input class="edit-input" data-field="infants" type="number" min="0" max="10" value="${r.infants}"></td><td><textarea class="edit-note" data-field="note">${esc(r.note)}</textarea></td><td>${new Date(r.createdAt).toLocaleDateString()}</td><td><div class="actions"><button data-action="save">Save</button><button data-action="cancel">Cancel</button></div></td></tr>`;return `<tr data-id="${r.id}"><td>${esc(r.name)}</td><td class="${r.attendance}">${r.attendance==='accept'?'Attending':'Declined'}</td><td>${r.adults}</td><td>${r.children}</td><td>${r.infants}</td><td>${esc(r.note)||'—'}</td><td>${new Date(r.createdAt).toLocaleDateString()}</td><td><div class="actions"><button data-action="edit">Edit</button><button class="delete" data-action="delete">Delete</button></div></td></tr>`}
    function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
    function showNotice(message,isError=false){notice.textContent=message;notice.classList.toggle('error',isError);notice.hidden=false;setTimeout(()=>notice.hidden=true,3500)}
    responsesView.addEventListener('click',async event=>{const button=event.target.closest('button[data-action]');if(!button)return;const row=button.closest('tr'),id=Number(row.dataset.id),action=button.dataset.action;if(action==='edit'){editingId=id;render();return}if(action==='cancel'){editingId=null;render();return}if(action==='save'){const values=Object.fromEntries([...row.querySelectorAll('[data-field]')].map(input=>[input.dataset.field,input.value]));button.disabled=true;try{const res=await fetch(API,{method:'PATCH',headers:headers(),body:JSON.stringify({id,...values})});if(!res.ok)throw new Error();await load(credentials.email,credentials.password);showNotice('Attendee updated.')}catch{showNotice('Could not save the changes. Please try again.',true)}return}if(action==='delete'){const attendee=rows.find(r=>r.id===id);if(!confirm(`Delete ${attendee?.name||'this attendee'}? This cannot be undone.`))return;button.disabled=true;try{const res=await fetch(API+'?id='+id,{method:'DELETE',headers:headers()});if(!res.ok)throw new Error();await load(credentials.email,credentials.password);showNotice('Attendee deleted.')}catch{showNotice('Could not delete the attendee. Please try again.',true)}}});
    document.querySelector('#login-form').onsubmit=async event=>{event.preventDefault();err.hidden=true;try{await load(document.querySelector('#email').value,document.querySelector('#password').value)}catch{err.hidden=false}};
    document.querySelector('#logout').onclick=()=>{sessionStorage.removeItem('wedding-admin');location.reload()};
    const saved=sessionStorage.getItem('wedding-admin');if(saved){try{const savedCredentials=JSON.parse(saved);load(savedCredentials.email,savedCredentials.password).catch(()=>sessionStorage.removeItem('wedding-admin'))}catch{sessionStorage.removeItem('wedding-admin')}}
  </script>
</body>
</html>
