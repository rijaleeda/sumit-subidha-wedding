<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>RSVP Dashboard | Sumit &amp; Subidha</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3eee4;color:#2b2925;font-family:Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:32px 18px 60px}.login{max-width:440px;margin:10vh auto;background:#fffdf8;border:1px solid #cdbb91;padding:32px;text-align:center}.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.24em;color:#927033}h1,h2{font-family:Georgia,serif;font-weight:400;color:#781d18}h1{font-size:40px;margin:8px 0}h2{font-size:26px}.login input{display:block;width:100%;padding:13px;border:1px solid #cdbb91;margin:20px 0 12px}.button{border:0;background:#7d1e18;color:#fffaf1;padding:13px 20px;cursor:pointer}.button.full{width:100%}.error{color:#9b1c1c}.header{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid #cdbb91;padding-bottom:24px;margin-bottom:30px}.logout{border:1px solid #b9a477;background:transparent;padding:9px 14px;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:30px}.stat{border:1px solid #d5c6a7;background:#fffdf8;padding:16px}.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#70685d}.stat strong{display:block;font-family:Georgia,serif;font-size:30px;font-weight:400;color:#781d18;margin-top:8px}.panel{border:1px solid #cdbb91;background:#fffdf8;overflow:hidden}.panel h2{padding:0 20px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;border-top:1px solid #e2d8c5;padding:13px 15px;vertical-align:top}th{background:#f5f0e6;color:#70685d;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.accept{color:#47704b}.decline{color:#8b3c38}.empty{text-align:center;padding:50px;color:#70685d}@media(max-width:800px){.summary{grid-template-columns:repeat(3,1fr)}.header{align-items:start;gap:15px}.wrap{padding-top:20px}}@media(max-width:480px){.summary{grid-template-columns:repeat(2,1fr)}h1{font-size:32px}}
</style></head><body><section class="login" id="login"><p class="eyebrow">Sumit &amp; Subidha</p><h1>Organizer Login</h1><p>Enter your organizer email and private wedding password.</p><form id="login-form"><input id="email" type="email" required autocomplete="email" placeholder="Organizer email"><input id="password" type="password" required autocomplete="current-password" placeholder="Password"><button class="button full">Open dashboard</button><p class="error" id="login-error" hidden>Email or password not recognized.</p></form></section><main class="wrap" id="dashboard" hidden><header class="header"><div><p class="eyebrow">Sumit &amp; Subidha</p><h1>RSVP Dashboard</h1></div><button class="logout" id="logout">Log out</button></header><section class="summary" id="summary"></section><section class="panel"><h2>Guest responses</h2><div class="scroll" id="responses"></div></section></main><script>
const API='https://sumit-subidha-wedding.eedarijal.chatgpt.site/api/admin/rsvps';const login=document.querySelector('#login'),dashboard=document.querySelector('#dashboard'),err=document.querySelector('#login-error');async function load(email,password){const res=await fetch(API,{headers:{authorization:'Bearer '+password,'x-admin-email':email.trim().toLowerCase()}});if(!res.ok)throw new Error();const {responses}=await res.json();sessionStorage.setItem('wedding-admin',JSON.stringify({email,password}));render(responses);login.hidden=true;dashboard.hidden=false}function render(rows){const accepted=rows.filter(r=>r.attendance==='accept'),sum=k=>accepted.reduce((a,r)=>a+Number(r[k]||0),0),declined=rows.length-accepted.length;document.querySelector('#summary').innerHTML=[['Responses',rows.length],['Attending',accepted.length],['Adults',sum('adults')],['Children',sum('children')],['Infants',sum('infants')],['Declined',declined]].map(([l,v])=>`<div class="stat"><span>${l}</span><strong>${v}</strong></div>`).join('');document.querySelector('#responses').innerHTML=rows.length?`<table><thead><tr><th>Name</th><th>Status</th><th>Adults</th><th>Children</th><th>Infants</th><th>Note</th><th>Date</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="${r.attendance}">${r.attendance==='accept'?'Attending':'Declined'}</td><td>${r.adults}</td><td>${r.children}</td><td>${r.infants}</td><td>${esc(r.note)||'—'}</td><td>${new Date(r.createdAt).toLocaleDateString()}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No RSVPs yet.</div>'}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}document.querySelector('#login-form').onsubmit=async e=>{e.preventDefault();err.hidden=true;try{await load(document.querySelector('#email').value,document.querySelector('#password').value)}catch{err.hidden=false}};document.querySelector('#logout').onclick=()=>{sessionStorage.removeItem('wedding-admin');location.reload()};const saved=sessionStorage.getItem('wedding-admin');if(saved){try{const credentials=JSON.parse(saved);load(credentials.email,credentials.password).catch(()=>sessionStorage.removeItem('wedding-admin'))}catch{sessionStorage.removeItem('wedding-admin')}}
</script></body></html>
